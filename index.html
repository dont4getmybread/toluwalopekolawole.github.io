  <link rel="manifest" href="/site.webmanifest">

  <style>
    :root{
      --bg:#fdfdfc;
      --text:#1d1d1b;
      --muted:#999996;
      --line:#f2f2f2;
      --link-bg:#e9e9e6;
      --link-hover:#deded9;
      --focus-shadow:0 0 0 18px var(--bg);
      --max:550px;
      --twitter:#1DA1F2;
      --dark:#20201e;
      --dark-muted:#55554f;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      transition:background .22s ease, color .22s ease;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size:15px;
      line-height:1.56;
      letter-spacing:-0.004em;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .site-shell{
      width:min(calc(100% - 36px), var(--max));
      margin:0 auto;
      padding:85px 0 140px;
    }

    h1,h2,p{margin-top:0}

    h1{
      margin-bottom:3px;
      font-size:16px;
      line-height:1.3;
      font-weight:500;
    }

    .updated{
      margin-bottom:31px;
      color:var(--muted);
      font-size:13px;
    }

    p{
      margin-bottom:21px;
    }

    strong{
      font-weight:600;
      color:#1d1d1b;
    }

    a{
      color:#2b2b28;
      background:none;
      text-decoration:underline;
      text-decoration-thickness:.75px;
      text-underline-offset:3px;
      text-decoration-color:rgba(29,29,27,.18);
      padding:0;
      transition:color .15s ease, text-decoration-color .15s ease, opacity .15s ease;
    }

    a:hover,
    a:focus-visible{
      color:#000;
      text-decoration-color:rgba(29,29,27,.42);
      outline:none;
    }

    .intro{
